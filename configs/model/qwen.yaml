# Backbone configuration.  The checkpoint per run_mode lives in BACKBONE_REGISTRY
# (src/amaun/config.py) -- idea.md S0.1 requires a single lookup table, not inline ids.
# Values here override the registry only when explicitly set.
model:
  device: auto              # resolved against BackboneSpec.device_preference
  quantization: null        # null => registry default (nf4 for actual, none otherwise)
  max_seq_len: null         # null => registry default
  use_chat_template: true   # instruct backbones expect their own template

lora:
  # LoRA hyperparameters. TO BE TUNED on VALIDATION only (protocol S8).
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:           # Qwen2 attention + MLP projections
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

generation:
  # Identical across every arm (invariant I12.2). Greedy by default so evaluation is
  # deterministic and differences between arms cannot come from sampling noise.
  do_sample: false
  num_beams: 1
  max_new_tokens: 128
  temperature: 1.0
  top_p: 1.0
  repetition_penalty: 1.0
