# Federated arm F2 -- Is the compatibility gate doing work?
# TASK, CLIENT, ADAPTER and ROUND are independent axes (docs/decision_register.md D-011).
includes: [experiments/base.yaml]
experiment_id: F2_naive_aggregation
curriculum:
  repository_init: bootstrap_six
  seed_tasks: [sum, qa, instr, dialog, longform, domain]
  evaluated_stream: [sum, qa, instr, dialog, longform, domain]
federated:
  enabled: true
  partition: iid_shards
  dirichlet_alpha: 0.5
  num_clients: 4
  round_every: 2
  participation_rate: 1.0
  compatibility:
    key: task_id
    require_same_rank: false
    require_same_target_modules: false
    require_same_backbone: false
  aggregation:
    method: delta_fedavg
    weight_by: example_count
