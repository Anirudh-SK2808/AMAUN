# Federated arm F5 -- Does federation help at all? Fully local control.
# TASK, CLIENT, ADAPTER and ROUND are independent axes (docs/decision_register.md D-011).
includes: [experiments/base.yaml]
experiment_id: F5_no_aggregation
curriculum:
  repository_init: bootstrap_six
  seed_tasks: [sum, qa, instr, dialog, longform, domain]
  evaluated_stream: [sum, qa, instr, dialog, longform, domain]
federated:
  enabled: false
  partition: iid_shards
  dirichlet_alpha: 0.5
  num_clients: 4
  round_every: 2
  participation_rate: 1.0
  compatibility:
    key: task_id
    require_same_rank: true
    require_same_target_modules: true
    require_same_backbone: true
  aggregation:
    method: delta_fedavg
    weight_by: example_count
