# Shared experiment settings. Concrete arms include this file.
includes:
  - model/qwen.yaml
  - training/default.yaml
  - datasets/curriculum.yaml
  - fusion/learnable_layerwise.yaml
  - utility/default.yaml
  - federated/default.yaml

evaluation:
  max_test_examples: 8          # cap for smoke/dummy; raise for `actual`
  # Forward transfer needs S[j-1][j]: the score on task j BEFORE learning it. Enabling this
  # lets the EVALUATOR read a future task's TEST split for reporting only; the manager never
  # sees those scores (docs/system_specification.md M10, invariant I10.2).
  evaluate_unseen_for_fwt: true

experiment:
  seeds: [1234]               # D-012 requires >=3 seeds for any REPORTED run
  budget_tolerance: 0.05      # relative budget divergence allowed between compared arms
  allow_unequal_budget: false
  allow_dirty_git: false      # gated for `actual` runs
  evaluate_every_task: true

curriculum:
  repository_init: null       # bootstrap_six | empty_sequential -- NO DEFAULT (D-002 OPEN)
  evaluated_stream: null      # list of task ids forming the arriving-task stream
  seed_tasks: null            # tasks used to bootstrap the repository (bootstrap_six only)

# Per-run-mode overlays keep values visible in config_used.json rather than hidden in code.
run_mode_overrides:
  dummy:
    data:
      provider: synthetic
      synthetic_pool_size: 64
      synthetic_test_size: 16
      smoke_max_examples_per_split: 8
    training:
      max_steps: 2
      batch_size: 2
      gradient_accumulation_steps: 1
      eval_every_steps: null
      log_every_steps: 1
    fusion:
      steps: 2
    utility:
      training:
        epochs: 5
      supervision:
        max_pairs_per_event: 2
        proxy_steps: 2
    features:
      semantic:
        hidden_probe_examples: 4
      gradient:
        reference_batch_size: 2
      performance:
        max_eval_examples: 4
  local_smoke:
    data:
      # Real data on a real (small) backbone: this tier is what proves the download -> pinned
      # revision -> row adaptation -> four-way split -> leakage-audit path end to end before any
      # `actual` run (docs/experiment_protocol.md S1 precondition 2). Still NON-REPORTABLE.
      provider: huggingface
      smoke_max_examples_per_split: 32
      # >= max(train_pool, test) for every task below (FR-3.7); recorded in config_used.json and
      # in every snapshot manifest because it determines how near-random the sample is.
      shuffle_buffer_size: 1024
      # train_pool >= cap / min(split_ratios) = 32 / 0.15 = 214, taken to 400 so hash-bucket
      # variation cannot leave a split short of the cap; test >= cap = 32, taken to 64.
      volumes:
        sum:
          train_pool: 400
          test: 64
          test_split: validation
        qa:
          train_pool: 400
          test: 64
          test_split: validation
        instr:
          # dolly-15k has ONE split (train, 15 011 rows), so TEST is an offset window of it.
          # test_offset must be >= the rows the training pool actually consumed (enforced against
          # the measured count in prepare_data, FR-4.4) and
          # train_pool + test_offset + test <= 15 011 (EC-7).
          train_pool: 400
          test: 64
          test_split: train
          test_offset: 500
        dialog:
          train_pool: 400
          test: 64
          test_split: validation
        longform:
          train_pool: 400
          test: 64
          test_split: validation
        domain:
          train_pool: 400
          test: 64
          test_split: test
    training:
      max_steps: 10
    fusion:
      steps: 5
